name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: CubeScope.Web/package-lock.json

      # Tests marked [Trait("Category","Integration")] require a real SSAS and are excluded.
      - name: Test (unit only)
        run: dotnet test CubeScope.Core.Tests -c Release --filter "Category!=Integration"

      # The .csproj EmbedSpa target runs "npm run build" on publish: the front-end
      # deps must be installed first.
      - name: Install web dependencies
        run: npm ci
        working-directory: CubeScope.Web

      # Tag v1.2.3 -> assembly/file version 1.2.3
      - name: Publish single-file executable
        shell: bash
        run: >
          dotnet publish CubeScope.Shell -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EmbedSpa=true
          -p:Version=${GITHUB_REF_NAME#v} -p:UpdateChannel=release -o publish

      # UpdateChannel=release is what makes the shipped exe look for updates (UpdateBuild). Without
      # it the users of this release would never be offered the next one, and nothing would say
      # so: the attribute AssemblyMetadata("UpdateChannel", "release") is stored as a fixed byte
      # blob (prolog 01 00, length-prefixed strings, no named arguments 00 00), looked for in the
      # entry assembly the publish bundled.
      - name: Refuse to ship an exe that is not on the release channel
        shell: pwsh
        run: |
          [byte[]] $blob = @(1, 0, 13) + [Text.Encoding]::UTF8.GetBytes('UpdateChannel') +
                           @(7) + [Text.Encoding]::UTF8.GetBytes('release') + @(0, 0)
          $latin1 = [Text.Encoding]::Latin1
          $assembly = "$PWD/CubeScope.Shell/obj/Release/net10.0-windows/win-x64/cubescope.dll"
          if (-not (Test-Path $assembly)) {
            Write-Host "::error::$assembly not found: the update-channel check cannot read the bundled assembly."
            exit 1
          }
          $dll = $latin1.GetString([IO.File]::ReadAllBytes($assembly))
          if ($dll.IndexOf($latin1.GetString($blob), [StringComparison]::Ordinal) -lt 0) {
            Write-Host '::error::cubescope.dll does not carry AssemblyMetadata("UpdateChannel", "release"): the exe would never look for an update.'
            exit 1
          }
          Write-Host 'The bundled cubescope.dll carries the release update channel.'

      - name: Compute SHA256
        shell: bash
        working-directory: publish
        run: sha256sum cubescope.exe > cubescope.exe.sha256 && cat cubescope.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            publish/cubescope.exe
            publish/cubescope.exe.sha256
          generate_release_notes: true
